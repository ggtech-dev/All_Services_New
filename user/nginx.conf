# All Services — customer app. Single-page app + the API on the same address (no CORS needed).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;   # photo uploads (bills, prescriptions, documents)

  # the API and uploaded photos: forwarded to the API container ("^~" = these win over the app-page rule below)
  location ^~ /api/     { proxy_pass http://server:5000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location ^~ /uploads/ { proxy_pass http://server:5000; proxy_set_header Host $host; }

  # hashed files never change: cache for a year
  location ^~ /assets/  { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  # the app shell, service worker and manifest are always re-checked, so a new version reaches everyone at once
  location = /sw.js                { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
  # any page (/orders/12, /agent/wallet …) is the single-page app; file addresses that don't exist are a 404
  location ~ ^[^.]*$ { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
  location / { try_files $uri =404; }
}
