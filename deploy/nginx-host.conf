# The machine's own Nginx: the four domains → the four app containers (docker-compose.yml, ports 8081-8084).
# Copy to /etc/nginx/sites-available/allservices, link it into sites-enabled, then get free HTTPS certificates:
#   sudo certbot --nginx -d allservicesapp.in -d www.allservicesapp.in -d partner.allservicesapp.in -d admin.allservicesapp.in -d hq.allservicesapp.in
# (replace the domain everywhere if you use a different one)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name allservicesapp.in www.allservicesapp.in;          # 👤 customer app (Play Store app)
  client_max_body_size 12m;
  location / { proxy_pass http://127.0.0.1:8081; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name partner.allservicesapp.in;                             # 🛵 agents & partners
  client_max_body_size 12m;
  location / { proxy_pass http://127.0.0.1:8082; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name admin.allservicesapp.in;                               # 🛡️ franchise admins
  client_max_body_size 12m;
  location / { proxy_pass http://127.0.0.1:8083; include /etc/nginx/proxy_params; }
}
server {
  listen 80;
  server_name hq.allservicesapp.in;                                  # 👑 Super Admin (HQ)
  client_max_body_size 12m;
  location / { proxy_pass http://127.0.0.1:8084; include /etc/nginx/proxy_params; }
}
